name: Build Metabase GizmoSQL Driver

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Clojure + clj-kondo
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.0.1479
        clj-kondo: 2026.04.15
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint driver source
      run: clj-kondo --lint src

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One build per supported Metabase release line. Keep in sync with the
        # compatibility table in README.md. 62.x EOLs 2026-09-01.
        metabase-ref: [ v0.62.5, v0.63.1.6 ]

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v7
      with:
        repository: metabase/metabase
        ref: ${{ matrix.metabase-ref }}
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v7
      with:
        path: metabase/modules/drivers/gizmosql

    - name: Register gizmosql as the only driver module
      working-directory: ./metabase
      # Overwriting with a single-entry map (the pattern the ClickHouse driver
      # used) is robust across Metabase versions: building one driver does not
      # need the in-tree driver modules registered, and upstream reshuffles of
      # modules/drivers (sqlite moved to core, druid removed, ...) can no
      # longer break us.
      run: |
        echo '{:deps {metabase/gizmosql {:local/root "gizmosql"}}}' > modules/drivers/deps.edn
        cat modules/drivers/deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Install Yarn 1.x
      run: |
        npm install -g yarn@1
        yarn --version

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.0.1479
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-${{ matrix.metabase-ref }}-${{ hashFiles('metabase/modules/drivers/gizmosql/deps.edn', 'metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-${{ matrix.metabase-ref }}-

    - name: Build driver
      working-directory: ./metabase
      run: |
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh gizmosql

    - name: Rename jar per Metabase line
      run: |
        MB_LINE=$(echo "${{ matrix.metabase-ref }}" | sed -E 's/^v0\.([0-9]+).*/mb\1/')
        mkdir -p out
        cp metabase/resources/modules/gizmosql.metabase-driver.jar \
           "out/gizmosql.metabase-driver-${MB_LINE}.jar"
        ls -la out/

    - name: Upload driver artifact
      uses: actions/upload-artifact@v7
      with:
        name: metabase-gizmosql-driver-${{ matrix.metabase-ref }}
        path: out/*.jar
        if-no-files-found: error

  # Runs Metabase's own driver test harness (test extensions under test/)
  # against a GizmoSQL service, scoped to the driver's test namespace (which
  # loads the shared test-data dataset through the harness: DDL + INSERT over
  # Flight SQL, validated sync, MBQL known-answer queries) plus the pure unit
  # tests for the connection spec builder.
  driver-test-suite:
    runs-on: ubuntu-latest
    services:
      gizmosql:
        image: gizmodata/gizmosql:v1.35.1
        env:
          TLS_ENABLED: "0"
          GIZMOSQL_USERNAME: gizmosql
          GIZMOSQL_PASSWORD: gizmosql_password
          SECRET_KEY: ci-test-jwt-signing-key-0123456789abcdef
          PRINT_QUERIES: "0"
        ports:
          - 31337:31337

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v7
      with:
        repository: metabase/metabase
        ref: v0.63.1
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v7
      with:
        path: metabase/modules/drivers/gizmosql

    - name: Register driver module and test path
      working-directory: ./metabase
      run: |
        echo '{:deps {metabase/gizmosql {:local/root "gizmosql"}}}' > modules/drivers/deps.edn
        # insert our test dir into the :drivers-dev :extra-paths vector
        sed -i 's|"modules/drivers/athena/test"|"modules/drivers/gizmosql/test"\n    "modules/drivers/athena/test"|' deps.edn
        grep -n "gizmosql/test" deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.0.1479
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-tests-v0.63.1-${{ hashFiles('metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-tests-v0.63.1-

    - name: Run driver test namespace via the shared harness
      working-directory: ./metabase
      env:
        DRIVERS: gizmosql
        MB_GIZMOSQL_TEST_HOST: localhost
        MB_GIZMOSQL_TEST_PORT: "31337"
        MB_GIZMOSQL_TEST_USER: gizmosql
        MB_GIZMOSQL_TEST_PASSWORD: gizmosql_password
      run: |
        clojure -X:dev:drivers:drivers-dev:test :only '[metabase.driver.gizmosql-test]'

  # NOTE: releases are cut by release.yaml on vX.Y.Z tag pushes.
