name: Release Metabase GizmoSQL Driver

# Releases are cut by pushing a vX.Y.Z tag (release flow: update CHANGELOG +
# bump version.txt -> commit -> `git push origin main vX.Y.Z`). Main pushes
# only run CI checks (build.yaml).
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)release
        required: true

permissions:
  contents: write

jobs:
  # Test gate: the FULL suite (lint, per-Metabase builds, driver-test-suite,
  # and the e2e stack) runs on the tagged commit itself. Never rely on "CI
  # passed on main" — `git push origin main vX.Y.Z` starts both workflows at
  # once, so nothing would wait. Both must pass before anything is published.
  ci:
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    permissions:
      contents: read

  release:
    needs: [ ci, e2e ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout driver code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Resolve version
      id: version
      run: |
        TAG="${{ github.event.inputs.tag || github.ref_name }}"
        VER="${TAG#v}"
        echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        if [ "$(cat version.txt)" != "$VER" ]; then
          echo "::error::version.txt ($(cat version.txt)) does not match tag $TAG"
          exit 1
        fi

    - name: Extract CHANGELOG section for release notes
      run: |
        VER="${{ steps.version.outputs.version }}"
        awk -v ver="$VER" '
          $0 ~ "^## \\[" ver "\\]" { found=1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if ! [ -s release-notes.md ]; then
          echo "::error::No CHANGELOG.md section found for $VER"
          exit 1
        fi
        cat release-notes.md

    # The per-Metabase jars built (and tested) by the ci gate in this run.
    - name: Download built jars
      uses: actions/download-artifact@v8
      with:
        pattern: metabase-gizmosql-driver-*
        merge-multiple: true
        path: out

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        body_path: release-notes.md
        files: out/*.jar
