info:
  name: Metabase GizmoSQL Driver
  version: 1.0.0
  description: Allows Metabase to connect to GizmoSQL via the GizmoSQL JDBC driver.

# contact-info belongs at the top level (not inside driver)
contact-info:
  name: GizmoData
  address: https://github.com/gizmodata/metabase-gizmosql-driver/issues

driver:
  name: gizmosql
  display-name: GizmoSQL
  lazy-load: true
  parent: sql-jdbc

  connection-properties:
    # Use built-in host; override placeholder if you want
    - merge:
        - host
        - { placeholder: "localhost" }

    # Use built-in port; override placeholder (31337 is GizmoSQL's default)
    - merge:
        - port
        - { placeholder: "31337" }

    # ------------------------------------------------------------------
    # Authentication. A boolean toggle switches between username/password
    # and bearer-token fields — the same pattern the built-in Databricks
    # (use-m2m) and Snowflake (use-password) drivers use. (The build-time
    # manifest linter only allows boolean/string/secret/... property types,
    # so a select dropdown is not authorable in yaml.)
    #
    # Coverage of the GizmoSQL auth landscape:
    #   user/password        -> Flight handshake basic auth
    #   GizmoSQL external JWT-> Username literally "token", JWT in Password
    #   bearer token         -> enable "Use token"
    #   OAuth2 / headers     -> additional-options (oauth.*, custom params)
    - name: use-token
      display-name: Authenticate with a token instead of username/password
      type: boolean
      default: false

    - name: username
      display-name: Username
      required: false
      visible-if:
        use-token: false

    - merge:
        - password
        - display-name: Password
          required: false
          visible-if:
            use-token: false

    # Secret-typed field: stored as token-value / token-id in details and
    # resolved in the driver via driver-api/secret-value-as-string. Sent as
    # "Authorization: Bearer <token>".
    - name: token
      display-name: Bearer token / PAT / API key
      type: secret
      secret-kind: password
      required: false
      visible-if:
        use-token: true

    - name: catalog
      display-name: Catalog (optional)
      type: string
      required: false

    # Standard include/exclude schema patterns (comma-separated, * wildcards);
    # honored during table discovery in describe-database.
    - name: schema-filters
      type: schema-filters
      display-name: Schemas

    # Secure by default, matching both the GizmoSQL JDBC driver's own
    # defaults and the :or defaults in connection-details->spec. Local demo
    # servers without TLS need Use Encryption switched off explicitly.
    - name: useEncryption
      display-name: Use Encryption
      type: boolean
      default: true

    - name: disableCertificateVerification
      display-name: Disable Certificate Verification
      type: boolean
      default: false

    # Advanced section helpers are literal strings
    - advanced-options-start

    # mTLS / custom CA. Stored as secrets; materialized to files and passed
    # to the JDBC driver as tlsRootCerts / clientCertificate / clientKey.
    # visible-if advanced-options keeps them inside the collapsed section
    # (the secret expansion does not inherit the section gating on its own).
    - name: tls-root-certs
      display-name: Server CA certificate (PEM)
      type: secret
      secret-kind: pem-cert
      required: false
      visible-if:
        advanced-options: true

    - name: client-cert
      display-name: mTLS client certificate (PEM)
      type: secret
      secret-kind: pem-cert
      required: false
      visible-if:
        advanced-options: true

    - name: client-key
      display-name: mTLS client key (PEM)
      type: secret
      secret-kind: pem-cert
      required: false
      visible-if:
        advanced-options: true

    # GizmoSQL's DuckDB backend is writable and accepts CSV uploads and Data
    # Studio table transforms; leave this off for read-only deployments.
    - name: enable-uploads
      display-name: Writable backend (enable CSV uploads & transforms)
      type: boolean
      default: false
      visible-if:
        advanced-options: true

    # String (not integer): the manifest linter has no integer type; the
    # driver coerces it.
    - name: connect-timeout-millis
      display-name: Connect timeout (ms)
      placeholder: "10000"
      required: false
      visible-if:
        advanced-options: true

    # Free-form URL parameters appended to the JDBC URL. Doubles as the
    # escape hatch for oauth.* properties (OAuth2 client_credentials /
    # token_exchange, Arrow JDBC >= 19.0.0), retainCookies/retainAuth, and
    # custom gRPC headers (any unknown parameter is forwarded as a header,
    # e.g. database=<db> for InfluxDB 3).
    - merge:
        - additional-options
        - { placeholder: "threadPoolSize=1&retainAuth=true" }
    - default-advanced-options

init:
  - step: load-namespace
    namespace: metabase.driver.gizmosql
  - step: register-jdbc-driver
    class: org.apache.arrow.driver.jdbc.ArrowFlightJdbcDriver
